<!DOCTYPE html>
<html>

<head>
    <title>Student Login</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>



    <div class="login-container">

    <h1>ExamGuard</h1>

    <h2>Login</h2>

    <form method="POST">

        <input type="text"
        name="username"
        placeholder="Username"
        required>

        <input type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

    </div>



</body>

</html>
